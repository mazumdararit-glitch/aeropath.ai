[project]
name = "aeropath"
version = "0.1.0"
description = "Route and time planner that ranks outdoor activity by air pollution exposure."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "geoalchemy2>=0.15",
    "redis[hiredis]>=5.0",
    "celery[redis]>=5.4",
    "h3>=4.1",
    "shapely>=2.0",
    "numpy>=1.26",
    "httpx>=0.28",
    "anthropic>=0.40",
    "firebase-admin>=6.5",
    "structlog>=24.0",
    "sentry-sdk[fastapi]>=2.0",
    "prometheus-fastapi-instrumentator>=7.0",
    "orjson>=3.10",
    "tenacity>=9.0",
    "pybreaker>=1.2",
]

[project.optional-dependencies]
geospatial = [
    "osmnx>=2.0",
    "networkx>=3.3",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeropath"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"scripts/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "network: test requires live external network access",
    "slow: test takes more than a few seconds",
]
