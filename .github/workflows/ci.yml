name: CI & Secret Scanning

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-and-lint:
    name: Tests and Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      - name: Run Mypy Type Check
        run: mypy src

      - name: Run Pytest Suite
        run: |
          python -m pytest tests -v --tb=short 2>&1 | tee pytest_output.txt
          exit ${PIPESTATUS[0]}
        env:
          PYTHONPATH: src

      - name: Annotate Pytest Failure
        if: failure()
        run: |
          while IFS= read -r line; do
            echo "::error title=Pytest Failure::$line"
          done < <(grep -E 'FAILED|ERROR|ModuleNotFoundError|AssertionError|ImportError' pytest_output.txt | head -n 30)

      - name: Upload Pytest Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest_output.txt
